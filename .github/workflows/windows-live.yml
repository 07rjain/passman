name: Windows published client acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actual public release and verify local decryption
        shell: powershell
        run: ./distribution/check-windows.ps1 -Published
