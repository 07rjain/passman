<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="440"
  viewBox="0 0 1000 440"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Proposed automatic SDK retrieval</title>
  <desc id="desc">
    The local application supplies a project and secret name. The SDK requests
    encrypted data from the service with a read credential, obtains the matching
    private key through OS or workload-protected storage, and returns plaintext
    only to the local application. The private key stays on the client.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto-start-reverse"
    >
      <path d="M0 0 L8 4 L0 8" fill="#516378" />
    </marker>
  </defs>
  <rect width="1000" height="440" rx="16" fill="#f5f7fb" />
  <g font-family="system-ui, sans-serif" fill="#172b42">
    <text x="30" y="36" font-size="20" font-weight="700">
      Proposed: authorize once, retrieve locally
    </text>
    <text x="30" y="63" font-size="14" fill="#516378">
      Draft flow · ordinary retrieval has no vault-password prompt
    </text>
    <rect
      x="25"
      y="85"
      width="620"
      height="325"
      rx="14"
      fill="#e8f4f0"
      stroke="#aacfc0"
    />
    <text x="45" y="115" font-size="15" font-weight="700">YOUR MACHINE</text>
    <rect
      x="45"
      y="145"
      width="190"
      height="92"
      rx="10"
      fill="#ffffff"
      stroke="#aacfc0"
    />
    <text x="65" y="177" font-size="17" font-weight="700">
      Application / agent
    </text>
    <text x="65" y="202" font-size="14">Project + secret name</text>
    <rect
      x="330"
      y="145"
      width="280"
      height="92"
      rx="10"
      fill="#ffffff"
      stroke="#aacfc0"
    />
    <text x="350" y="177" font-size="17" font-weight="700">SDK</text>
    <text x="350" y="202" font-size="14">Fetch → validate → decrypt</text>
    <path
      d="M240 166 H323"
      stroke="#516378"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <path
      d="M323 217 H242"
      stroke="#516378"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <text x="247" y="208" font-size="12">Plaintext</text>
    <rect
      x="330"
      y="295"
      width="280"
      height="84"
      rx="10"
      fill="#ffffff"
      stroke="#aacfc0"
    />
    <text x="350" y="326" font-size="17" font-weight="700">
      OS / workload key storage
    </text>
    <text x="350" y="353" font-size="14">Matching key + saved credential</text>
    <path
      d="M465 290 V244"
      stroke="#516378"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <text x="480" y="271" font-size="13">Local key use</text>
    <text x="45" y="330" font-size="14">Private key stays local.</text>
    <text x="45" y="354" font-size="14">The receiving application</text>
    <text x="45" y="375" font-size="14">can copy the value.</text>
    <rect
      x="755"
      y="145"
      width="220"
      height="145"
      rx="10"
      fill="#e9effb"
      stroke="#afbfdf"
    />
    <text x="775" y="177" font-size="17" font-weight="700">
      Service / website API
    </text>
    <text x="775" y="205" font-size="14">Checks read permission</text>
    <text x="775" y="231" font-size="14">Stores encrypted values</text>
    <text x="775" y="257" font-size="14">Holds no private vault key</text>
    <path
      d="M616 166 H748"
      stroke="#516378"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <text x="654" y="151" font-size="12">Read credential</text>
    <path
      d="M748 217 H616"
      stroke="#516378"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <text x="665" y="241" font-size="12">Ciphertext</text>
    <text x="755" y="333" font-size="13" fill="#516378">
      Human setup is separate
    </text>
    <text x="755" y="355" font-size="13" fill="#516378">
      from routine SDK reads.
    </text>
  </g>
</svg>
